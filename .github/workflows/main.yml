```yaml
name: Build Minecraft Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Java
        run: java -version

      - name: Build JAR
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew not found in repository root"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: build/libs/*.jar
          if-no-files-found: error
```
